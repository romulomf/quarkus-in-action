quarkus:
  application:
    name: Reservation Service
  datasource:
    db-kind: postgresql
    username: user
    password: pass
    devservices:
      port: 5432
  hibernate-orm:
    database:
      generation: drop-and-create
  http:
    port: 8081
    test-port: 8181
  oidc:
    application-type: service
  smallrye-graphql-client:
    inventory:
      url: http://localhost:8083/graphql
"%test":
  mp:
    messaging:
      incoming:
        invoices-rabbitmq:
          connector: smallrye-rabbitmq
          queue:
            name: invoices
          exchange:
            name: invoices
"%prod":
  quarkus:
    datasource:
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/reservation