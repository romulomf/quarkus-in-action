quarkus:
  application:
    name: Billing Service
  container-image:
    group: romulomf
    name: billing-service
    registry: quay.io
  http:
    port: 8084
  mongodb:
    database: billing
mp:
  messaging:
    incoming:
      invoices:
        connector: smallrye-rabbitmq
      invoices-adjust:
        auto:
          offset:
            reset: earliest
        connector: smallrye-kafka
    outgoing:
      invoices-confirmations:
        connector: smallrye-kafka
"%prod":
  kafka:
    bootstrap:
      servers: localhost:9092
    rabbitmq-host: localhost
    rabbitmq-port: 5672
    rabbitmq-http-port: 15672
    rabbitmq-username: guest
    rabbitmq-password: guest