quarkus:
  application:
    name: Inventory Service
  datasource:
    db-kind: mysql
    username: user
    password: pass
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
    sql-load-script: import.sql
  http:
    port: 8083
  smallrye-graphql:
    ui:
      always-include: true
"%prod":
  quarkus:
    datasource:
      jdbc:
        url: jdbc:mysql://localhost:3306/inventory